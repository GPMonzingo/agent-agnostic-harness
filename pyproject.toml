[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-agnostic-harness"
version = "0.1.0"
description = "Local repository intelligence and model-agnostic coding harness"
requires-python = ">=3.10"

[project.scripts]
ai-harness = "harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["harness*"]
